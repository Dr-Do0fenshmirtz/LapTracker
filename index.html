<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lap Counter Part 3</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: Arial;
      }
      #toolbar {
        padding: 8px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #status {
        padding: 6px;
        background: #222;
        color: #fff;
      }
      #map {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="enableBtn">Enable Location</button>
      <button id="recordBtn" disabled>Record</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="startBtn" disabled>Start Counting</button>
      <span>Laps: <b id="laps">0</b></span>
      <span>Progress: <b id="progress">0%</b></span>
    </div>
    <div id="status">Ready</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
