<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lap Counter</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="top">
      <button id="enableBtn">Enable Location</button>
      <button id="recordBtn" disabled>Record Route</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="startBtn" disabled>Start Counting</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="status">Press "Enable Location"</div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
