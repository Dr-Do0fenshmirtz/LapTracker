<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Lap Counter</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<section id="home" class="screen"><main><h1>Lap Counter</h1><p id="subtitle">Record a track to get started.</p><button id="record" class="card"><b>●</b><span><strong>Record</strong><small id="recordHint">Create your track</small></span><i>›</i></button><button id="count" class="card"><b>▶</b><span><strong>Start Counting</strong><small>Follow your saved track</small></span><i>›</i></button><div id="progressCard" class="progress" hidden><div class="progress-values"><div><small>Progress / Count</small><strong id="homeCount">0</strong><em>laps</em></div><div class="progress-percent"><strong id="homePct">0.0%</strong><em>current lap</em></div></div><button id="resetProgress" type="button">Reset Progress</button></div><p id="message"></p></main></section>
<section id="mapScreen" class="map-screen" hidden><div id="map"></div><div id="status">Getting location…</div><button id="stop">Stop</button></section>
<section id="countScreen" class="screen count-screen" hidden><main><h1>Lap Counter</h1><p>Counting your saved track.</p><div class="progress counting-progress"><div class="progress-values"><div><small>Progress / Count</small><strong id="liveCount">0</strong><em>laps</em></div><div class="progress-percent"><strong id="livePct">0.0%</strong><em>current lap</em></div></div></div><button id="stopCounting" class="count-stop" type="button">Stop Counting</button></main></section>
<section id="permission" class="permission" hidden><div><h2>Location access needed</h2><p id="permissionText">Allow location access to record and follow your track.</p><button id="retry">Try Again</button><button id="back">Back</button></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script><script src="app.js"></script></body></html>
